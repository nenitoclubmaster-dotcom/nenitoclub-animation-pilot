name: validate-pilot

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - run: python scripts/validate_episode.py episodes/pilot_wave_v0.1.json
      - run: python scripts/build_timeline.py episodes/pilot_wave_v0.1.json
